<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='um-theme.css') }}">
</head>

<body>
    <main class="container">
    <div class="top-accent"></div>
    {% if username %}
    <p class="signed-in">Signed in as: {{ username }}</p>
    {% endif %}
    <a href="/patients">Home</a>
    <h2>Patient Form</h2>
    <form id="patientForm">
        <label for="firstname">First name:</label><br>
        <input type="text" id="firstname" name="firstname" required><br>

        <label for="lastname">Last name:</label><br>
        <input type="text" id="lastname" name="lastname" required><br>

        <label for="regnum">Registration #:</label><br>
        <input type="number" id="regnum" name="regnum" required><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" required><br>

        <label for="height">Height (cm):</label><br>
        <input type="number" id="height" name="height" required><br>

        <label for="weight">Weight (kg):</label><br>
        <input type="number" id="weight" name="weight" required><br><br>

        <label for="sex">Sex:</label><br>
        <label>
            <input type="radio" name="sex" value="male" required>
            Male
        </label><br>
        <label>
            <input type="radio" name="sex" value="female" required>
            Female
        </label><br>

        <label for="startdate">Start date:</label><br>
        <input type="date" id="startdate" name="startdate" required><br><br>

            <label for="location">Hospital location:</label><br>
    <label>
        <input type="radio" name="location" value="7E" required>
        7E
    </label><br>

    <label>
        <input type="radio" name="location" value="7W">
        7W
    </label><br>

    <label>
        <input type="radio" name="location" value="8E">
        8E
    </label><br>

    <label>
        <input type="radio" name="location" value="other">
        Other
        <input type="text" id="otherLocation" name="otherLocation">
    </label><br><br>

    <label for="roomNumber">Room number (optional):</label><br>
    <input type="text" id="roomNumber" name="roomNumber"><br><br>

    <input type="submit" value="Submit">
    </form>

    <br><br>
    

    <script>
        document.getElementById('patientForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const location = document.querySelector('input[name="location"]:checked').value;
            const sex = document.querySelector('input[name="sex"]:checked').value;
            const finalLocation = location === 'other' ? document.getElementById('otherLocation').value : location;

            const formData = {
                firstName: document.getElementById('firstname').value,
                lastName: document.getElementById('lastname').value,
                registrationNumber: document.getElementById('regnum').value,
                age: document.getElementById('age').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                sex: sex,
                startDate: document.getElementById('startdate').value,
                hospitalLocation: finalLocation,
                roomNumber: document.getElementById('roomNumber').value,
                submissionTime: new Date().toISOString()
            };


            fetch('/save-patient-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    alert('Patient data saved successfully!');
                    document.getElementById('patientForm').reset();
                    window.location.href = "/patients";
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error saving patient data');
                });
        });
    </script>
    </main>
</body>

</html>
