<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>

<body>
    {% if username %}
    <p>Signed in as: {{ username }}</p>
    {% endif %}

    <h2>TEMPLATE FORM</h2>
    <form id="patientForm">
        <label for="firstname">First name:</label><br>
        <input type="text" id="firstname" name="firstname" required><br>

        <label for="lastname">Last name:</label><br>
        <input type="text" id="lastname" name="lastname" required><br>

        <label for="regnum">Registration #:</label><br>
        <input type="number" id="regnum" name="regnum" required><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" required><br>

        <label for="height">Height:</label><br>
        <input type="number" id="height" name="height" required><br>

        <label for="weight">Weight:</label><br>
        <input type="number" id="weight" name="weight" required><br><br>

        <label for="sex">Sex:</label><br>
        <label>
            <input type="radio" name="sex" value="male" required>
            Male
        </label><br>
        <label>
            <input type="radio" name="sex" value="female" required>
            Female
        </label><br>

        <label for="startdate">Start date:</label><br>
        <input type="date" id="startdate" name="startdate" required><br><br>

        <label for="location">Hospital location:</label><br>
        <label>
            <input type="radio" name="location" value="7E" required>
            7E
        </label><br>

        <label>
            <input type="radio" name="location" value="7W">
            7W
        </label><br>

        <label>
            <input type="radio" name="location" value="8E">
            8E
        </label><br>

        <label>
            <input type="radio" name="location" value="other">
            Other
            <input type="text" id="otherLocation" name="otherLocation">
        </label><br><br>

        <input type="submit" value="Submit">
    </form>

    <br><br>
    <table>
        <caption>Calculations:</caption>
        <tr>
            <th>BSA</th>
            <td id="bsa"></td>
            <th>IBW</th>
            <td id="ibw"></td>
        </tr>
        <tr>
            <th>Adj. BW</th>
            <td id="adj_bw"></td>
            <th>Adj. BSA</th>
            <td id="adj_bsa"></td>
        </tr>
    </table>

    </table>
    <form id="dosageTable">
        <table id="dosageRows">
            <caption>Dosage Table:</caption>
            <thead>
                <tr>
                    <th>Date Made</th>
                    <th>Drug and Dose</th>
                    <th>Dose #</th>
                    <th>Due Date(s)</th>
                    <th>Time(s) Due</th>
                    <th>Final Product Checked</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dosageTableBody">
                <tr class="dosage-row">
                    <td><input type="date" name="date_made[]" required></td>
                    <td><input type="text" name="drug[]" required></td>
                    <td><input type="number" name="dose_num[]" required></td>
                    <td><input type="date" name="due_date[]" required></td>
                    <td><input type="time" name="time_due[]" required></td>
                    <td><input type="checkbox" name="p_checked[]"></td>
                    <td><button type="button" class="remove-row-btn">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <button type="button" id="addRowBtn">+ Add Row</button>
        <br><br>
        <input type="submit" value="Submit">
    </form>

    <script>
        document.getElementById('patientForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const location = document.querySelector('input[name="location"]:checked').value;
            const sex = document.querySelector('input[name="sex"]:checked').value;
            const finalLocation = location === 'other' ? document.getElementById('otherLocation').value : location;

            const formData = {
                firstName: document.getElementById('firstname').value,
                lastName: document.getElementById('lastname').value,
                registrationNumber: document.getElementById('regnum').value,
                age: document.getElementById('age').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                sex: sex,
                startDate: document.getElementById('startdate').value,
                hospitalLocation: finalLocation,
                submissionTime: new Date().toISOString()
            };


            fetch('/calculate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {

                    document.getElementById("bsa").textContent = data.bsa.toFixed(2);
                    document.getElementById("ibw").textContent = data.ibw.toFixed(2);
                    document.getElementById("adj_bw").textContent = data.adj_bw.toFixed(2);
                    document.getElementById("adj_bsa").textContent = data.adj_bsa.toFixed(2);

                });

            fetch('/save-patient-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    alert('Patient data saved successfully!');
                    document.getElementById('patientForm').reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error saving patient data');
                });
        });

        document.getElementById('dosageTable').addEventListener('submit', function (e) {
            e.preventDefault();

            const rows = document.querySelectorAll('.dosage-row');
            const tableDataArray = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                const tableData = {
                    dateMade: inputs[0].value,
                    drug: inputs[1].value,
                    doseNum: inputs[2].value,
                    dueDate: inputs[3].value,
                    timeDue: inputs[4].value,
                    pChecked: inputs[5].checked,
                };
                tableDataArray.push(tableData);
            });

            fetch('/save-table-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(tableDataArray)
            })
                .then(response => response.json())
                .then(data => {
                    alert('Dosage data saved successfully!');
                    //document.getElementById('dosageTable').reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error saving dosage data');
                });
        });

        // Add row functionality
        document.getElementById('addRowBtn').addEventListener('click', function () {
            const tableBody = document.getElementById('dosageTableBody');
            const newRow = document.createElement('tr');
            newRow.className = 'dosage-row';
            newRow.innerHTML = `
                <td><input type="date" name="date_made[]" required></td>
                <td><input type="text" name="drug[]" required></td>
                <td><input type="number" name="dose_num[]" required></td>
                <td><input type="date" name="due_date[]" required></td>
                <td><input type="time" name="time_due[]" required></td>
                <td><input type="checkbox" name="p_checked[]"></td>
                <td><button type="button" class="remove-row-btn">Remove</button></td>
            `;
            tableBody.appendChild(newRow);
            attachRemoveRowListener(newRow.querySelector('.remove-row-btn'));
        });

        // Remove row functionality
        function attachRemoveRowListener(button) {
            button.addEventListener('click', function () {
                const row = this.closest('tr');
                if (document.querySelectorAll('.dosage-row').length > 1) {
                    row.remove();
                } else {
                    alert('You must keep at least one row!');
                }
            });
        }

        // Attach remove row listeners to initial row
        document.querySelectorAll('.remove-row-btn').forEach(btn => {
            attachRemoveRowListener(btn);
        });
    </script>
</body>

</html>
